name: Binance CMS Announcement Worker Tests

on:
  push:
    branches:
      - feature/binance-cms-announcement-worker
    paths:
      - "announcement-worker/**"
      - "layer1/**"
      - "tests/**"
      - "main.py"
      - ".github/workflows/announcement-worker-tests.yml"
  pull_request:
    paths:
      - "announcement-worker/**"
      - "layer1/**"
      - "tests/**"
      - "main.py"
      - ".github/workflows/announcement-worker-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mocked-announcement-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
      - name: Install locked worker dependencies
        working-directory: announcement-worker
        run: npm ci
      - name: Run offline mocked tests and SDK contract test
        working-directory: announcement-worker
        run: npm test

  python-layer1-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install existing image dependency
        run: python -m pip install Pillow
      - name: Compile Python sources
        run: python -m compileall -q main.py image_engine.py layer1
      - name: Run full mocked Python test suite
        run: python -m unittest discover -s tests -v
