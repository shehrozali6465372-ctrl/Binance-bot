name: Main dry-run safety tests

on:
  pull_request:
    branches: [main]
    paths:
      - "main.py"
      - "tests/**"
      - ".github/workflows/main-dry-run-safety-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dry-run-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run isolated safety regression tests
        run: python -m unittest discover -s tests -v
      - name: Compile changed Python modules
        run: python -m compileall -q main.py tests
      - name: Check whitespace errors
        run: git diff --check
