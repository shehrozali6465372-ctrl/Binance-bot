name: Binance CMS Announcement Ingestion

on:
  # The schedule becomes active after this isolated integration is merged into main.
  schedule:
    - cron: "*/5 * * * *"
  # Allows a controlled manual smoke run from a selected branch.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: binance-cms-announcement-ingestion
  cancel-in-progress: false

jobs:
  ingest-announcements:
    name: Bounded read-only CMS ingestion window
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      BINANCE_API_KEY: ${{ secrets.BINANCE_API_KEY }}
      BINANCE_API_SECRET: ${{ secrets.BINANCE_API_SECRET }}
      DATABASE_URL: ${{ secrets.BINANCE_ANNOUNCEMENT_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: announcement-worker/package-lock.json

      - name: Install locked worker dependencies
        working-directory: announcement-worker
        run: npm ci --omit=dev

      - name: Validate required secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          for name in BINANCE_API_KEY BINANCE_API_SECRET DATABASE_URL; do
            if [[ -z "${!name:-}" ]]; then
              echo "Required GitHub Actions secret is missing: $name" >&2
              exit 1
            fi
          done
          node --input-type=module -e '
            const url = new URL(process.env.DATABASE_URL);
            if (!["postgres:", "postgresql:"].includes(url.protocol) || url.searchParams.get("sslmode") !== "verify-full") {
              throw new Error("BINANCE_ANNOUNCEMENT_DATABASE_URL must be PostgreSQL with sslmode=verify-full");
            }
          '

      - name: Run CMS listener for a bounded four-minute window
        working-directory: announcement-worker
        shell: bash
        run: |
          set -euo pipefail
          # The official CMS interface is a WebSocket stream, not a REST polling API.
          # Keep one bounded connection window per five-minute schedule and let the
          # worker's SIGTERM handler drain accepted writes and close resources cleanly.
          timeout --preserve-status --signal=TERM --kill-after=20s 240s node src/worker.js
