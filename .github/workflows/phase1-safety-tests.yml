name: Phase 1 Safety Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, "phase-1/**"]

permissions:
  contents: read

jobs:
  mocked-safety-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install image dependency
        run: python -m pip install Pillow
      - name: Compile Python sources
        run: python -m compileall -q main.py image_engine.py layer1
      - name: Run mocked publication safety tests
        run: python -m unittest discover -s tests -v
